<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EncryptIA - Bredaz</title>
    
    <!-- Enlace al manifiesto PWA -->
    <link rel="manifest" href="./manifest.json">

    <!-- Etiquetas exclusivas para iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="EncryptIA">
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./assets/favicon-16x16.png">
    <link rel="shortcut icon" href="./assets/favicon.ico">

    <script>
        // Redirect to trailing slash to ensure relative assets load correctly
        if (window.location.pathname.toLowerCase().endsWith('/app')) {
            window.location.replace(window.location.pathname + '/' + window.location.search + window.location.hash);
        }

        // Diagnostic error console
        window.onerror = function(message, source, lineno, colno, error) {
            showError("Error: " + message + "\nSource: " + source + "\nLine: " + lineno + ":" + colno + (error ? "\nStack: " + error.stack : ""));
            return false;
        };
        window.addEventListener('unhandledrejection', function(event) {
            var reason = event.reason;
            var text = "Unhandled Rejection: " + reason;
            if (reason && reason.stack) {
                text += "\nStack: " + reason.stack;
            } else if (reason && typeof reason === 'object') {
                try { text += "\nObject JSON: " + JSON.stringify(reason); } catch(e) {}
            }
            showError(text);
        });
        function showError(text) {
            var errDiv = document.getElementById('debug-error-console');
            if (!errDiv) {
                errDiv = document.createElement('div');
                errDiv.id = 'debug-error-console';
                errDiv.setAttribute('style', 'position:absolute; top:10px; left:10px; right:10px; padding:20px; background:rgba(220,38,38,0.95); color:white; font-family:monospace; font-size:12px; z-index:100000; white-space:pre-wrap; border-radius:8px; box-shadow:0 10px 15px -3px rgba(0,0,0,0.5); max-height:80%; overflow:auto; border:2px solid #ef4444;');
                document.body.appendChild(errDiv);
            }
            errDiv.textContent += text + "\n\n";
            console.error(text);
        }
    </script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020617; /* Slate950 */
            font-family: system-ui, -apple-system, sans-serif;
        }

        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            background-color: #020617; /* Slate950 */
            z-index: 9999;
            transition: opacity 0.5s ease-in-out;
        }

        #ComposeTarget {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            display: block;
            touch-action: none;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(34, 211, 238, 0.1);
            border-radius: 50%;
            border-top-color: #22d3ee;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .logo-text {
            margin-top: 24px;
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #ffffff;
            text-transform: uppercase;
        }

        .subtitle {
            margin-top: 8px;
            font-size: 12px;
            font-weight: 600;
            color: #22d3ee;
            letter-spacing: 3px;
            text-transform: uppercase;
            opacity: 0.8;
        }
    </style>
    <script type="text/javascript" src="shared.js" defer></script>
</head>
<body>
    <div id="ComposeTarget"></div>
    <div id="loading-screen">
        <div class="spinner"></div>
        <div class="logo-text">EncryptIA</div>
        <div class="subtitle">Bredaz</div>
    </div>

    <!-- Registro del Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(registration => {
              console.log('ServiceWorker registrado con éxito');
            })
            .catch(err => {
              console.log('Error al registrar ServiceWorker: ', err);
            });
        });
      }
    </script>
</body>
</html>
