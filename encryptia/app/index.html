<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EncryptIA - Bredaz</title>
    
    <!-- Enlace al manifiesto PWA -->
    <link rel="manifest" href="./manifest.json?v=3">

    <!-- Etiquetas exclusivas para iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="EncryptIA">
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png?v=3">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32x32.png?v=3">
    <link rel="icon" type="image/png" sizes="16x16" href="./assets/favicon-16x16.png?v=3">
    <link rel="shortcut icon" href="./assets/favicon.ico?v=3">

    <script>
        // Diagnostic error console
        window.onerror = function(message, source, lineno, colno, error) {
            showError("Error: " + message + "\nSource: " + source + "\nLine: " + lineno + ":" + colno + (error ? "\nStack: " + error.stack : ""));
            return false;
        };
        window.addEventListener('unhandledrejection', function(event) {
            var reason = event.reason;
            var text = "Unhandled Rejection: " + reason;
            if (reason && reason.stack) {
                text += "\nStack: " + reason.stack;
            } else if (reason && typeof reason === 'object') {
                try { text += "\nObject JSON: " + JSON.stringify(reason); } catch(e) {}
            }
            showError(text);
        });
        function showError(text) {
            var errDiv = document.getElementById('debug-error-console');
            if (!errDiv) {
                errDiv = document.createElement('div');
                errDiv.id = 'debug-error-console';
                errDiv.setAttribute('style', 'position:absolute; top:10px; left:10px; right:10px; padding:20px; background:rgba(220,38,38,0.95); color:white; font-family:monospace; font-size:12px; z-index:100000; white-space:pre-wrap; border-radius:8px; box-shadow:0 10px 15px -3px rgba(0,0,0,0.5); max-height:80%; overflow:auto; border:2px solid #ef4444;');
                document.body.appendChild(errDiv);
            }
            errDiv.textContent += text + "\n\n";
            console.error(text);
        }
    </script>
    
    <link rel="preload" href="shared.js" as="script">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020617; /* Slate950 */
            font-family: system-ui, -apple-system, sans-serif;
        }

        #ComposeTarget {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            display: block;
            touch-action: none;
        }

        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #020617; /* Slate950 */
            z-index: 9999;
            transition: opacity 0.5s ease-in-out;
        }

        /* Responsive Skeleton Wrapper */
        .skeleton-app-shell {
            width: 100%;
            max-width: 480px;
            height: 100%;
            display: flex;
            flex-direction: column;
            background-color: #020617;
            position: relative;
            box-sizing: border-box;
            border-left: 1px solid rgba(30, 41, 59, 0.3);
            border-right: 1px solid rgba(30, 41, 59, 0.3);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
        }

        /* Header Skeleton */
        .skeleton-header {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            height: 85px;
            border-bottom: 1px solid rgba(30, 41, 59, 0.2);
            box-sizing: border-box;
            gap: 12px;
        }
        .skeleton-profile {
            width: 40px;
            height: 40px;
            border-radius: 50%;
        }
        .skeleton-user-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-grow: 1;
        }
        .skeleton-username {
            width: 120px;
            height: 16px;
            border-radius: 4px;
        }
        .skeleton-badge {
            width: 70px;
            height: 12px;
            border-radius: 3px;
        }
        .skeleton-settings-btn {
            width: 28px;
            height: 28px;
            border-radius: 8px;
        }

        /* Content Skeleton */
        .skeleton-content {
            flex-grow: 1;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            overflow: hidden;
            box-sizing: border-box;
        }
        .skeleton-progress-card {
            height: 130px;
            border-radius: 16px;
        }
        .skeleton-section-title {
            width: 140px;
            height: 18px;
            border-radius: 4px;
            margin-top: 8px;
        }
        .skeleton-feed {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .skeleton-feed-item {
            height: 85px;
            border-radius: 12px;
        }

        /* Bottom Nav Skeleton */
        .skeleton-bottom-nav {
            height: 90px;
            border-top: 1px solid rgba(30, 41, 59, 0.3);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 16px 12px 16px;
            box-sizing: border-box;
            background-color: #020617;
        }
        .skeleton-nav-item {
            width: 44px;
            height: 44px;
            border-radius: 12px;
        }

        /* Shimmer Animation */
        @keyframes shimmer {
            0% {
                background-position: -200% 0;
            }
            100% {
                background-position: 200% 0;
            }
        }
        .skeleton {
            background: linear-gradient(90deg, #090f1d 25%, #1e293b 50%, #090f1d 75%);
            background-size: 200% 100%;
            animation: shimmer 1.6s infinite linear;
        }
    </style>
    <script type="text/javascript" src="shared.js" defer></script>
</head>
<body>
    <div id="ComposeTarget"></div>
    <div id="loading-screen">
        <!-- Dashboard Skeleton App Shell -->
        <div class="skeleton-app-shell">
            <!-- App Header Skeleton -->
            <div class="skeleton-header">
                <div class="skeleton-profile skeleton"></div>
                <div class="skeleton-user-info">
                    <div class="skeleton-username skeleton"></div>
                    <div class="skeleton-badge skeleton"></div>
                </div>
                <div class="skeleton-settings-btn skeleton"></div>
            </div>
            
            <!-- Dashboard Main Content Skeleton -->
            <div class="skeleton-content">
                <div class="skeleton-progress-card skeleton"></div>
                <div class="skeleton-section-title skeleton"></div>
                <div class="skeleton-feed">
                    <div class="skeleton-feed-item skeleton"></div>
                    <div class="skeleton-feed-item skeleton"></div>
                    <div class="skeleton-feed-item skeleton"></div>
                </div>
            </div>
            
            <!-- Bottom Nav Skeleton -->
            <div class="skeleton-bottom-nav">
                <div class="skeleton-nav-item skeleton"></div>
                <div class="skeleton-nav-item skeleton"></div>
                <div class="skeleton-nav-item skeleton"></div>
                <div class="skeleton-nav-item skeleton"></div>
                <div class="skeleton-nav-item skeleton"></div>
            </div>
        </div>
    </div>

    <!-- Registro del Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(registration => {
              console.log('ServiceWorker registrado con éxito');
            })
            .catch(err => {
              console.log('Error al registrar ServiceWorker: ', err);
            });
        });
      }
    </script>

    <!-- PWA Installation Suggest/Force Overlay -->
    <style>
        #pwa-install-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 6, 23, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            z-index: 99999;
            display: none;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            box-sizing: border-box;
            padding: 20px;
        }

        #pwa-install-overlay.show {
            display: flex;
        }

        .install-card {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(34, 211, 238, 0.35);
            border-radius: 24px;
            width: 100%;
            max-width: 420px;
            padding: 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(34, 211, 238, 0.2);
            text-align: center;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .install-logo-wrap {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(34, 211, 238, 0.4);
            border: 2px solid #22d3ee;
            background: #020617;
        }

        .install-logo-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .install-title {
            font-size: 22px;
            font-weight: 800;
            color: #ffffff;
            margin: 0;
            letter-spacing: -0.02em;
        }

        .install-title span {
            color: #22d3ee;
        }

        .install-desc {
            font-size: 14px;
            line-height: 1.6;
            color: #cbd5e1;
            margin: 0;
        }

        .install-instruction-box {
            width: 100%;
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 16px;
            text-align: left;
            box-sizing: border-box;
        }

        .install-instruction-title {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #22d3ee;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .install-steps {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .install-step {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            font-size: 13px;
            color: #e2e8f0;
            line-height: 1.5;
        }

        .install-step-num {
            background: rgba(34, 211, 238, 0.15);
            color: #22d3ee;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            flex-shrink: 0;
        }

        .install-btn {
            width: 100%;
            background: linear-gradient(135deg, #22d3ee, #0891b2);
            color: #0f172a;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(34, 211, 238, 0.3);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .install-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(34, 211, 238, 0.5);
        }

        .install-btn:active {
            transform: translateY(1px);
        }

        .install-cancel-link {
            font-size: 12px;
            color: #64748b;
            text-decoration: underline;
            cursor: pointer;
            transition: color 0.2s;
            background: none;
            border: none;
            padding: 4px;
        }

        .install-cancel-link:hover {
            color: #cbd5e1;
        }
    </style>

    <div id="pwa-install-overlay">
        <div class="install-card">
            <div class="install-logo-wrap">
                <img src="./assets/apple-touch-icon.png?v=3" alt="EncryptIA Logo">
            </div>
            <h3 class="install-title">Instalar <span>EncryptIA</span></h3>
            <p class="install-desc">Para usar esta aplicación offline sin internet y disfrutar de la experiencia completa, instálala en tu dispositivo.</p>
            
            <div class="install-instruction-box">
                <div class="install-instruction-title" id="pwa-instruction-title">
                    Instrucciones
                </div>
                <div class="install-steps" id="pwa-steps-content">
                    <!-- Dynamic Steps insertion based on OS -->
                </div>
            </div>

            <button class="install-btn" id="btn-pwa-install" style="display: none;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width: 16px; height: 16px;">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                Instalar Aplicación
            </button>
            
            <button class="install-cancel-link" id="pwa-install-cancel">Continuar en el navegador</button>
        </div>
    </div>

    <script>
      let deferredPrompt;
      const overlay = document.getElementById('pwa-install-overlay');
      const installBtn = document.getElementById('btn-pwa-install');
      const cancelLink = document.getElementById('pwa-install-cancel');
      const stepContainer = document.getElementById('pwa-steps-content');
      const instructionTitle = document.getElementById('pwa-instruction-title');

      function isIos() {
        const userAgent = window.navigator.userAgent.toLowerCase();
        return /iphone|ipad|ipod/.test(userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      }

      function isStandalone() {
        return ('standalone' in window.navigator && window.navigator.standalone) || 
               window.matchMedia('(display-mode: standalone)').matches;
      }

      function getPlatform() {
        if (isIos()) return 'ios';
        if (/android/.test(window.navigator.userAgent.toLowerCase())) return 'android';
        return 'desktop';
      }

      function showInstallOverlay() {
        const platform = getPlatform();
        
        if (platform === 'ios') {
          instructionTitle.textContent = "Instalación en iPhone / iPad";
          stepContainer.innerHTML = `
            <div class="install-step">
              <div class="install-step-num">1</div>
              <span>Toca el botón <strong>Compartir</strong> <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:14px; height:14px; display:inline-block; vertical-align:middle; margin:-2px 2px 0;"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path><polyline points="16 6 12 2 8 6"></polyline><line x1="12" y1="2" x2="12" y2="15"></line></svg> en la barra inferior de Safari.</span>
            </div>
            <div class="install-step">
              <div class="install-step-num">2</div>
              <span>Busca y selecciona la opción <strong>"Agregar al inicio"</strong>.</span>
            </div>
          `;
          installBtn.style.display = 'none';
        } else if (platform === 'android') {
          instructionTitle.textContent = "Instalación en Android";
          stepContainer.innerHTML = `
            <div class="install-step">
              <div class="install-step-num">1</div>
              <span>Presiona el botón <strong>"Instalar Aplicación"</strong> abajo.</span>
            </div>
            <div class="install-step">
              <div class="install-step-num">2</div>
              <span>Si no se abre, toca los 3 puntos <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:14px; height:14px; display:inline-block; vertical-align:middle;"><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg> arriba a la derecha en Chrome y selecciona <strong>"Instalar aplicación"</strong>.</span>
            </div>
          `;
          // If deferredPrompt is already captured, show the install button
          if (deferredPrompt) {
            installBtn.style.display = 'flex';
          }
        } else {
          instructionTitle.textContent = "Instalación en Computadora";
          stepContainer.innerHTML = `
            <div class="install-step">
              <div class="install-step-num">1</div>
              <span>Presiona el botón <strong>"Instalar Aplicación"</strong> abajo.</span>
            </div>
            <div class="install-step">
              <div class="install-step-num">2</div>
              <span>O haz click en el icono de instalación <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px; height:14px; display:inline-block; vertical-align:middle;"><circle cx="12" cy="12" r="10"></circle><polyline points="8 12 12 16 16 12"></polyline><line x1="12" y1="8" x2="12" y2="16"></line></svg> en la barra de direcciones superior.</span>
            </div>
          `;
          if (deferredPrompt) {
            installBtn.style.display = 'flex';
          }
        }

        overlay.classList.add('show');
      }

      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        if (getPlatform() !== 'ios') {
          installBtn.style.display = 'flex';
        }
      });

      installBtn.addEventListener('click', async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          deferredPrompt = null;
          overlay.classList.remove('show');
        }
      });

      cancelLink.addEventListener('click', () => {
        overlay.classList.remove('show');
        // Cache dismissal timestamp to avoid showing on every page reload for 1 hour
        localStorage.setItem('pwa-overlay-dismissed', Date.now());
      });

      document.addEventListener('DOMContentLoaded', () => {
        const dismissedTime = localStorage.getItem('pwa-overlay-dismissed');
        const delayPeriod = 60 * 60 * 1000; // 1 hour cooldown to not be extremely annoying, but still highly suggest
        
        if (!isStandalone()) {
          if (!dismissedTime || (Date.now() - dismissedTime > delayPeriod)) {
            setTimeout(showInstallOverlay, 1500);
          }
        }
      });
    </script>
</body>
</html>
