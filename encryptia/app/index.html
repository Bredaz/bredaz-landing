<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EncryptIA - Bredaz</title>
    
    <!-- Enlace al manifiesto PWA -->
    <link rel="manifest" href="./manifest.json">

    <!-- Etiquetas exclusivas para iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="EncryptIA">
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./assets/favicon-16x16.png">
    <link rel="shortcut icon" href="./assets/favicon.ico">

    <script>
        // Diagnostic error console
        window.onerror = function(message, source, lineno, colno, error) {
            showError("Error: " + message + "\nSource: " + source + "\nLine: " + lineno + ":" + colno + (error ? "\nStack: " + error.stack : ""));
            return false;
        };
        window.addEventListener('unhandledrejection', function(event) {
            var reason = event.reason;
            var text = "Unhandled Rejection: " + reason;
            if (reason && reason.stack) {
                text += "\nStack: " + reason.stack;
            } else if (reason && typeof reason === 'object') {
                try { text += "\nObject JSON: " + JSON.stringify(reason); } catch(e) {}
            }
            showError(text);
        });
        function showError(text) {
            var errDiv = document.getElementById('debug-error-console');
            if (!errDiv) {
                errDiv = document.createElement('div');
                errDiv.id = 'debug-error-console';
                errDiv.setAttribute('style', 'position:absolute; top:10px; left:10px; right:10px; padding:20px; background:rgba(220,38,38,0.95); color:white; font-family:monospace; font-size:12px; z-index:100000; white-space:pre-wrap; border-radius:8px; box-shadow:0 10px 15px -3px rgba(0,0,0,0.5); max-height:80%; overflow:auto; border:2px solid #ef4444;');
                document.body.appendChild(errDiv);
            }
            errDiv.textContent += text + "\n\n";
            console.error(text);
        }
    </script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020617; /* Slate950 */
            font-family: system-ui, -apple-system, sans-serif;
        }

        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            background-color: #020617; /* Slate950 */
            z-index: 9999;
            transition: opacity 0.5s ease-in-out;
        }

        #ComposeTarget {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            display: block;
            touch-action: none;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(34, 211, 238, 0.1);
            border-radius: 50%;
            border-top-color: #22d3ee;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .logo-text {
            margin-top: 24px;
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #ffffff;
            text-transform: uppercase;
        }

        .subtitle {
            margin-top: 8px;
            font-size: 12px;
            font-weight: 600;
            color: #22d3ee;
            letter-spacing: 3px;
            text-transform: uppercase;
            opacity: 0.8;
        }
    </style>
    <script type="text/javascript" src="shared.js" defer></script>
</head>
<body>
    <div id="ComposeTarget"></div>
    <div id="loading-screen">
        <div class="spinner"></div>
        <div class="logo-text">EncryptIA</div>
        <div class="subtitle">Bredaz</div>
    </div>

    <!-- Registro del Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(registration => {
              console.log('ServiceWorker registrado con éxito');
            })
            .catch(err => {
              console.log('Error al registrar ServiceWorker: ', err);
            });
        });
      }
    </script>

    <!-- iOS PWA Installation Guide Prompt -->
    <style>
        #ios-pwa-prompt {
            position: fixed;
            bottom: -250px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            max-width: 380px;
            background: rgba(15, 23, 42, 0.94);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(34, 211, 238, 0.25);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6), 0 0 20px rgba(34, 211, 238, 0.15);
            z-index: 10000;
            transition: bottom 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            color: #f8fafc;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
        }

        #ios-pwa-prompt.show {
            bottom: 16px;
        }

        .ios-prompt-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ios-prompt-title {
            font-size: 15px;
            font-weight: 700;
            color: #22d3ee;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ios-prompt-close {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 22px;
            cursor: pointer;
            line-height: 1;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ios-prompt-close:hover {
            color: #f1f5f9;
        }

        .ios-prompt-body {
            font-size: 13px;
            line-height: 1.5;
            color: #cbd5e1;
        }

        .ios-prompt-steps {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 8px;
        }

        .ios-prompt-step {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ios-icon-wrapper {
            background: rgba(34, 211, 238, 0.12);
            border-radius: 6px;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: #22d3ee;
        }

        .ios-icon-wrapper svg {
            width: 16px;
            height: 16px;
        }
    </style>

    <div id="ios-pwa-prompt">
        <div class="ios-prompt-header">
            <div class="ios-prompt-title">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width: 18px; height: 18px;">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="17 8 12 3 7 8"></polyline>
                    <line x1="12" y1="3" x2="12" y2="15"></line>
                </svg>
                Instalar EncryptIA
            </div>
            <button class="ios-prompt-close" onclick="dismissIosPrompt()" aria-label="Cerrar">×</button>
        </div>
        <div class="ios-prompt-body">
            Instala esta aplicación en tu iPhone para usarla a pantalla completa y sin conexión a internet.
            <div class="ios-prompt-steps">
                <div class="ios-prompt-step">
                    <div class="ios-icon-wrapper">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
                            <polyline points="16 6 12 2 8 6"></polyline>
                            <line x1="12" y1="2" x2="12" y2="15"></line>
                        </svg>
                    </div>
                    <span>Toca el botón <strong>Compartir</strong> <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:12px; height:12px; display:inline-block; vertical-align:middle; margin:0 2px;"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path><polyline points="16 6 12 2 8 6"></polyline><line x1="12" y1="2" x2="12" y2="15"></line></svg> en la barra inferior de Safari.</span>
                </div>
                <div class="ios-prompt-step">
                    <div class="ios-icon-wrapper">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="12" y1="8" x2="12" y2="16"></line>
                            <line x1="8" y1="12" x2="16" y2="12"></line>
                        </svg>
                    </div>
                    <span>Selecciona <strong>"Agregar al inicio"</strong>.</span>
                </div>
            </div>
        </div>
    </div>

    <script>
      function isIos() {
        const userAgent = window.navigator.userAgent.toLowerCase();
        return /iphone|ipad|ipod/.test(userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      }
      function isStandalone() {
        return ('standalone' in window.navigator) && (window.navigator.standalone);
      }

      document.addEventListener('DOMContentLoaded', () => {
        // Show tooltip only on iOS when not installed
        if (isIos() && !isStandalone()) {
          if (!localStorage.getItem('ios-pwa-prompt-dismissed')) {
            setTimeout(() => {
              const prompt = document.getElementById('ios-pwa-prompt');
              if (prompt) {
                prompt.classList.add('show');
              }
            }, 3000);
          }
        }
      });

      function dismissIosPrompt() {
        const prompt = document.getElementById('ios-pwa-prompt');
        if (prompt) {
          prompt.classList.remove('show');
          localStorage.setItem('ios-pwa-prompt-dismissed', 'true');
        }
      }
    </script>
</body>
</html>
